<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loop stepper</title>
<style>
:root{--navy:#06005A;--lb:#B4C8FF;--cream:#F7ECDE;--grey:#757982;--blue:#4476FF}
*{box-sizing:border-box}body{margin:0;padding:16px;font:16px/1.5 Arial,Helvetica,sans-serif;color:#000;background:#fff}
.w{max-width:1000px;margin:0 auto}.panel{border:2px solid var(--navy);border-radius:6px;padding:12px 16px;background:#fff;margin:0 0 12px}
h2{margin:0 0 4px;font-size:20px}.sub{margin:0 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;align-items:center}
button,select{font:700 16px Arial,sans-serif;padding:8px 14px;border-radius:4px;border:2px solid var(--navy);background:#fff;color:#000;cursor:pointer;min-height:44px}
button:hover:not(:disabled),select:hover{background:var(--lb)}button:disabled{opacity:.45;cursor:not-allowed}
button[aria-pressed=true]{background:var(--navy);color:#fff}
button:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.mono{font-family:Consolas,Menlo,Monaco,'Liberation Mono','Courier New',monospace}
.chip{display:inline-block;border:2px solid var(--navy);border-radius:4px;background:var(--cream);padding:3px 8px;margin:0 6px 6px 0;font-size:14px}
.chip.on{background:var(--lb);border-width:3px;font-weight:bold}
table{border-collapse:collapse;width:100%}th{background:var(--navy);color:#fff;text-align:left;padding:5px 9px;font-size:14px;border:1px solid var(--navy)}
td{padding:5px 9px;border:1px solid var(--grey);font-size:14px}tr.on td,td.on{background:var(--lb);font-weight:bold}
.out{font-size:18px;padding:10px 14px;border:2px solid var(--navy);border-radius:6px;background:var(--cream)}
.vh{position:absolute;left:-9999px}.note{font-size:14px;font-style:italic}
.new{font-size:12px;font-family:Arial}
</style>
</head><body><div class="w">
<div class="panel"><h2>Stepping through the loop</h2><p class="sub">Each pass sets <code>scenario</code> to the next item in <code>scenarioList</code>, calculates its future value, and stores the result in the dictionary.</p>
<div class="bar"><button id="prev">Previous</button><button id="next">Next pass</button><button id="reset">Reset</button><span id="pass" style="font-weight:bold"></span></div>
<p style="margin:0 0 4px"><strong class="mono">scenarioList</strong></p><div id="chips"></div>
<p style="margin:8px 0 2px"><strong>The loop variable</strong></p><p class="mono" id="var" style="margin:0"></p>
<p style="margin:8px 0 2px"><strong>The calculation</strong></p><p class="mono" id="calc" style="margin:0"></p>
<table style="margin-top:12px"><caption style="text-align:left;font-weight:bold;padding-bottom:4px">scenarioDetails, "fv" values</caption><thead><tr><th>Scenario</th><th>fv</th><th>Note</th></tr></thead><tbody id="rows" class="mono"></tbody></table>
<div class="vh" role="status" aria-live="polite" id="live"></div></div>
</div>
<script>

const N=["base","optimistic","pessimistic"],FV=["1172804.13","1416348.98","967619.79"];let k=0;
const $=i=>document.getElementById(i);
function draw(){
 $("pass").textContent=k===0?"Before the loop starts":"Pass "+k+" of 3";
 $("chips").innerHTML=N.map((n,i)=>'<span class="chip mono'+(i===k-1?' on':'')+'">"'+n+'"'+(i===k-1?' (current)':'')+'</span>').join("");
 $("var").textContent=k===0?"scenario is not set yet":'scenario = "'+N[k-1]+'"';
 $("calc").textContent=k===0?"no calculation yet":"computeFV(...) → "+FV[k-1];
 $("rows").innerHTML=N.map((n,i)=>'<tr'+(i===k-1?' class="on"':'')+'><td>'+n+'</td><td>'+(i<k?FV[i]:"None")+'</td><td>'+(i===k-1?"just stored":"")+'</td></tr>').join("");
 $("prev").disabled=k===0;$("next").disabled=k===3;
 $("live").textContent=k===0?"Reset. Loop not started.":"Pass "+k+" of 3. scenario is "+N[k-1]+". Stored "+FV[k-1]+".";
}
$("next").onclick=()=>{if(k<3){k++;draw()}};$("prev").onclick=()=>{if(k>0){k--;draw()}};$("reset").onclick=()=>{k=0;draw()};draw();
</script></body></html>
