<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>List and dictionary lookup</title>
<style>
:root{--navy:#06005A;--lb:#B4C8FF;--cream:#F7ECDE;--grey:#757982;--blue:#4476FF}
*{box-sizing:border-box}body{margin:0;padding:16px;font:16px/1.5 Arial,Helvetica,sans-serif;color:#000;background:#fff}
.w{max-width:1000px;margin:0 auto}.panel{border:2px solid var(--navy);border-radius:6px;padding:12px 16px;background:#fff;margin:0 0 12px}
h2{margin:0 0 4px;font-size:20px}.sub{margin:0 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;align-items:center}
button,select{font:700 16px Arial,sans-serif;padding:8px 14px;border-radius:4px;border:2px solid var(--navy);background:#fff;color:#000;cursor:pointer;min-height:44px}
button:hover:not(:disabled),select:hover{background:var(--lb)}button:disabled{opacity:.45;cursor:not-allowed}
button[aria-pressed=true]{background:var(--navy);color:#fff}
button:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.mono{font-family:Consolas,Menlo,Monaco,'Liberation Mono','Courier New',monospace}
.chip{display:inline-block;border:2px solid var(--navy);border-radius:4px;background:var(--cream);padding:3px 8px;margin:0 6px 6px 0;font-size:14px}
.chip.on{background:var(--lb);border-width:3px;font-weight:bold}
table{border-collapse:collapse;width:100%}th{background:var(--navy);color:#fff;text-align:left;padding:5px 9px;font-size:14px;border:1px solid var(--navy)}
td{padding:5px 9px;border:1px solid var(--grey);font-size:14px}tr.on td,td.on{background:var(--lb);font-weight:bold}
.out{font-size:18px;padding:10px 14px;border:2px solid var(--navy);border-radius:6px;background:var(--cream)}
.note{font-size:14px;font-style:italic}
.new{font-size:12px;font-family:Arial}
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);clip-path:inset(50%);white-space:nowrap;border:0}
button[aria-disabled=true]{opacity:.6;cursor:not-allowed}button[aria-disabled=true]:hover{background:#fff}
.tw{overflow-x:auto;margin:12px 0}.tw:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sel{font-size:12px;font-weight:bold;margin-left:6px}
@media (forced-colors:active){button[aria-pressed=true]{border-width:5px;text-decoration:underline}.chip.on{border-width:5px;text-decoration:underline}tr.on td,td.on,.t.on{text-decoration:underline;font-weight:bold}button:focus-visible,select:focus-visible,.tw:focus-visible{outline:3px solid Highlight}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head><body><div class="w">
<div class="panel"><h2>A list finds an item by position. A dictionary finds a value by key.</h2>
<p class="note">Keyboard: press Tab to reach a drop-down list, then use the up and down arrow keys to change the choice. The result updates straight away.</p><h3 style="margin:12px 0 4px">List</h3><div id="lst"></div>
<div class="bar"><label for="idx"><strong>Position (index):</strong></label><select id="idx"><option>0</option><option selected>1</option><option>2</option></select></div>
<p class="out mono" id="o1" role="status"></p>
<h3 style="margin:16px 0 4px">Dictionary</h3>
<div class="tw" tabindex="0" role="region" aria-label="scenarioDetails, scrollable"><table><caption style="text-align:left;font-weight:bold;padding-bottom:4px">scenarioDetails</caption><thead><tr><th>Key</th><th>years</th><th>rate</th><th>fv</th></tr></thead><tbody id="dt" class="mono"></tbody></table></div>
<div class="bar" style="margin-top:12px"><label for="k1"><strong>First key:</strong></label><select id="k1"><option>base</option><option selected>optimistic</option><option>pessimistic</option></select><label for="k2"><strong>Second key:</strong></label><select id="k2"><option>years</option><option selected>rate</option><option>fv</option></select></div>
<p class="out mono" id="o2" role="status"></p></div>
</div>
<script>

const L=["base","optimistic","pessimistic"],D={base:{years:10,rate:0.05,fv:"None"},optimistic:{years:10,rate:0.07,fv:"None"},pessimistic:{years:10,rate:0.03,fv:"None"}};
const $=i=>document.getElementById(i);
function draw(){const i=+$("idx").value;
 $("lst").innerHTML=L.map((n,j)=>'<span class="chip mono'+(j===i?' on':'')+'">'+j+': "'+n+'"'+(j===i?' (selected)':'')+'</span>').join("");
 $("o1").textContent='scenarioList['+i+']  →  "'+L[i]+'"';
 const a=$("k1").value,b=$("k2").value;
 $("dt").innerHTML=L.map(n=>'<tr'+(n===a?' class="on"':'')+'><td>"'+n+'"</td>'+["years","rate","fv"].map(c=>'<td'+(n===a&&c===b?' class="on"':'')+'>'+D[n][c]+'</td>').join("")+'</tr>').join("");
 $("o2").textContent='scenarioDetails["'+a+'"]["'+b+'"]  →  '+D[a][b];}
["idx","k1","k2"].forEach(i=>$(i).onchange=draw);draw();
</script></body></html>
